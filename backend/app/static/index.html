<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handwritten Notes</title>
<style>
  :root {
    --paper: #faf8f3; --ink: #24303f; --muted: #8b8578;
    --line: #e2ddd2; --accent: #8a3b2f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 56px 32px 80px; }
  h1 { font-size: 26px; font-weight: 500; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 40px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  textarea {
    width: 100%; min-height: 340px; padding: 20px; resize: vertical;
    border: 1px solid var(--line); border-radius: 14px; background: #fff;
    font: 14px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink); outline: none;
  }
  textarea:focus { border-color: #c9c1b1; }
  .group { margin-top: 26px; }
  .label { font-size: 12px; letter-spacing: .07em; text-transform: uppercase;
           color: var(--muted); margin-bottom: 9px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 15px; border: 1px solid var(--line); border-radius: 999px;
    background: #fff; cursor: pointer; font-size: 13.5px; color: var(--ink);
    transition: all .14s ease;
  }
  .chip:hover { border-color: #c9c1b1; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.go {
    margin-top: 32px; padding: 13px 30px; border: 0; border-radius: 999px;
    background: var(--ink); color: var(--paper); font-size: 15px; cursor: pointer;
  }
  button.go:disabled { opacity: .45; cursor: default; }
  .preview {
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.06);
    min-height: 560px; display: flex; align-items: center; justify-content: center;
  }
  .preview iframe { width: 100%; height: 700px; border: 0; display: block; }
  .empty { color: var(--muted); font-size: 14px; padding: 40px; text-align: center; }
  .bar { display: flex; align-items: center; gap: 16px; margin-top: 16px; min-height: 24px; }
  .bar a { color: var(--accent); text-decoration: none; font-size: 14px; }
  .bar a:hover { text-decoration: underline; }
  .status { color: var(--muted); font-size: 13.5px; }
  .err { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Handwritten Notes</h1>
  <p class="sub">Type or paste your notes. Use <code>#</code> for headings, <code>-</code> for bullets, <code>1.</code> for lists.</p>

  <div class="cols">
    <div>
      <textarea id="raw" spellcheck="false"></textarea>

      <div class="group"><div class="label">Template</div><div class="chips" id="templates"></div></div>
      <div class="group"><div class="label">Handwriting</div><div class="chips" id="styles"></div></div>
      <div class="group"><div class="label">Paper</div><div class="chips" id="papers"></div></div>

      <button class="go" id="go">Generate</button>
    </div>

    <div>
      <div class="preview" id="preview"><div class="empty">Your notes will appear here</div></div>
      <div class="bar">
        <span class="status" id="status"></span>
        <a id="download" style="display:none" download="notes.pdf">Download PDF</a>
      </div>
    </div>
  </div>
</div>

<script>
const API = "/api/v1";
const chosen = { template_id: null, style_id: null, paper_id: null };
let objectUrl = null;

const SAMPLE = `Binary Search

# Definition
Binary search finds a target in a sorted array by repeatedly halving
the search interval.

Invariant: a condition true before and after every iteration.

## How it works
1. Find the middle element
2. Compare it with the target
   - smaller, search left
   - larger, search right
3. Repeat until found

Complexity:
O(log n)

Warning: fails silently on unsorted input.

e.g. one million elements needs at most 20 comparisons`;

document.getElementById("raw").value = SAMPLE;

function chips(containerId, items, key) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  items.forEach((item, i) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = item.name;
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    if (i === 0) chosen[key] = item.id;
    b.onclick = () => {
      chosen[key] = item.id;
      [...box.children].forEach(c => c.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
    };
    box.appendChild(b);
  });
}

async function loadOptions() {
  const [t, s, p] = await Promise.all([
    fetch(`${API}/templates`).then(r => r.json()),
    fetch(`${API}/handwriting-styles`).then(r => r.json()),
    fetch(`${API}/papers`).then(r => r.json()),
  ]);
  chips("templates", t, "template_id");
  chips("styles", s, "style_id");
  chips("papers", p, "paper_id");
}

function setStatus(text, isError) {
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = isError ? "status err" : "status";
}

async function generate() {
  const raw = document.getElementById("raw").value.trim();
  if (!raw) { setStatus("Nothing to generate.", true); return; }

  const go = document.getElementById("go");
  go.disabled = true;
  setStatus("Generating\u2026");

  try {
    // 1. raw text -> structured note
    const sres = await fetch(`${API}/notes/structure`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ raw_text: raw }),
    });
    if (!sres.ok) throw new Error((await sres.json()).detail || "Could not structure the text");
    const note = await sres.json();

    // 2. note -> pdf
    const rres = await fetch(`${API}/render`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note, ...chosen }),
    });
    if (!rres.ok) throw new Error("Could not render the PDF");

    const pages = rres.headers.get("X-Page-Count");
    const blob = await rres.blob();

    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(blob);

    document.getElementById("preview").innerHTML =
      `<iframe src="${objectUrl}#toolbar=0&view=FitH"></iframe>`;

    const dl = document.getElementById("download");
    dl.href = objectUrl;
    dl.download = (note.title || "notes").replace(/[^\w\- ]+/g, "") + ".pdf";
    dl.style.display = "inline";

    setStatus(`${note.blocks.length} blocks \u00b7 ${pages} page${pages === "1" ? "" : "s"}`);
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    go.disabled = false;
  }
}

document.getElementById("go").onclick = generate;
loadOptions().then(generate);
</script>
</body>
</html>
